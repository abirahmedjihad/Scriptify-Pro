<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RJ SCRIPT STUDIO - Splitter Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000; 
            --panel-bg: #05070a; 
            --accent-cyan: #00f0ff; 
            --accent-blue: #38bdf8;
            --neon-pink: #ff007f;  
            --text-main: #f1f5f9; 
            --text-muted: #64748b;
            --glass-border: rgba(255, 255, 255, 0.08);
            --active-glow: rgba(0, 240, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-black); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        body { 
            display: flex; 
            flex-direction: column; 
            background: #000000;
        }

        .container { 
            flex: 1; 
            padding: 16px; 
            max-width: 900px; 
            margin: 0 auto; 
            width: 100%; 
            z-index: 10;
        }
        
        header {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 50px;
            height: 50px;
            background: rgba(0, 240, 255, 0.03);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 20px;
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            animation: badgeGlow 2s infinite alternate ease-in-out;
        }

        @keyframes badgeGlow {
            0% { 
                border-color: var(--accent-cyan); 
                box-shadow: 0 0 8px rgba(0, 240, 255, 0.3), inset 0 0 5px rgba(0, 240, 255, 0.2); 
                transform: scale(1);
            }
            100% { 
                border-color: var(--neon-pink); 
                box-shadow: 0 0 18px rgba(255, 0, 127, 0.6), inset 0 0 10px rgba(255, 0, 127, 0.4); 
                color: #ffffff;
                transform: scale(1.03);
            }
        }

        .brand-text-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
            background: linear-gradient(90deg, #ffffff, var(--accent-cyan), var(--neon-pink), #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 3.5s linear infinite;
            margin: 0;
            line-height: 1.1;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--accent-cyan);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            animation: pulseSubtitle 2.5s infinite ease-in-out;
        }

        @keyframes pulseSubtitle {
            0%, 100% { opacity: 0.6; letter-spacing: 2.5px; }
            50% { opacity: 1; letter-spacing: 3px; color: #ffffff; }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .file-label { 
            cursor: pointer; 
            font-size: 10px; 
            font-weight: 700; 
            background: rgba(255,255,255,0.03); 
            color: var(--accent-blue); 
            padding: 6px 12px; 
            border-radius: 6px; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            border: 1px solid var(--glass-border); 
            font-family: 'Orbitron', sans-serif; 
            transition: all 0.25s; 
            letter-spacing: 0.5px;
        }
        .file-label:hover { 
            background: rgba(56, 189, 248, 0.12); 
            border-color: var(--accent-blue); 
        }

        .word-count-top { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 10px; 
            color: var(--accent-cyan); 
            font-weight: 700; 
            letter-spacing: 0.5px;
            background: rgba(0, 240, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-wrapper { position: relative; width: 100%; }

        textarea { 
            width: 100%; 
            height: 480px; 
            background: #000000; 
            border: 1px solid var(--glass-border); 
            border-radius: 8px; 
            padding: 14px; 
            padding-right: 48px; 
            box-sizing: border-box; 
            font-size: 13.5px; 
            color: var(--text-main);
            outline: none; 
            resize: vertical; 
            display: block; 
            transition: border-color 0.3s, box-shadow 0.3s; 
            font-family: 'Fira Code', monospace;
            line-height: 1.6;
        }
        
        textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px var(--active-glow);
        }
        
        .action-tray { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            z-index: 10; 
        }
        
        .icon-btn { 
            background: rgba(255, 0, 127, 0.12);
            border: 1px solid var(--neon-pink);
            border-radius: 6px;
            width: 36px; 
            height: 36px; 
            cursor: pointer; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            font-size: 15px; 
            color: var(--neon-pink); 
            transition: all 0.2s ease;
        }
        .icon-btn:hover { background: var(--neon-pink); color: #fff; transform: scale(1.05); }
        
        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .search-input-wrapper {
            flex: 1;
        }

        input[type="text"] { 
            width: 100%; 
            background: #000000; 
            border: 1px solid var(--glass-border); 
            padding: 10px 14px; 
            border-radius: 8px; 
            outline: none; 
            font-size: 13px; 
            color: #ffffff; 
            font-family: inherit; 
            transition: all 0.3s; 
        }
        input[type="text"]:focus { 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 10px var(--active-glow);
        }

        .extract-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000000;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            height: 40px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .extract-btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; display: none; }
        
        .cut-btn { 
            background: transparent; 
            color: var(--accent-cyan); 
            border: 1px solid var(--accent-cyan); 
            padding: 13px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            font-size: 12px; 
            font-family: 'Orbitron', sans-serif; 
            transition: all 0.3s; 
            text-transform: uppercase; 
        }
        .cut-btn:hover { background: var(--accent-cyan); color: #000000; }

        .download-btn { 
            background: transparent; 
            color: #d8b4fe; 
            border: 1px solid #c084fc; 
            padding: 13px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            font-size: 12px; 
            font-family: 'Orbitron', sans-serif; 
            transition: all 0.3s; 
            text-transform: uppercase; 
        }
        .download-btn:hover { background: #c084fc; color: #000000; }
        
        .undo-btn-wrapper { display: flex; justify-content: center; margin-top: 14px; }
        .undo-btn { 
            display: none; 
            background: #0f172a; 
            color: #ffffff; 
            border: 1px solid rgba(255,255,255,0.15); 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            align-items: center; 
            gap: 8px; 
            font-size: 11px; 
            font-family: 'Orbitron', sans-serif; 
            transition: all 0.2s; 
            text-transform: uppercase; 
        }
        .undo-btn:hover { background: #1e293b; border-color: var(--accent-cyan); }

        .result-box { 
            background: #000000; 
            border: 1px solid var(--glass-border); 
            padding: 16px; 
            white-space: pre-wrap; 
            border-radius: 8px; 
            font-size: 13.5px; 
            margin-top: 10px; 
            display: none; 
            color: var(--text-main); 
            line-height: 1.7; 
            width: 100%; 
            font-family: 'Fira Code', monospace; 
        }
        
        .highlight-red { color: var(--neon-pink); font-weight: 700; }
        .highlight-hash { color: var(--accent-cyan); font-weight: 600; }
        .highlight-meta { color: var(--accent-blue); font-weight: 700; display: block; border-bottom: 1px dashed var(--glass-border); padding-bottom: 8px; margin-bottom: 12px; font-family: 'Orbitron', sans-serif; font-size: 11px; }

        .counter-text { text-align: center; color: var(--accent-cyan); font-weight: 700; margin: 12px 0 6px 0; display: none; font-size: 11px; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; }

        #toast { position: fixed; bottom: -70px; left: 50%; transform: translateX(-50%); background: #090d16; color: var(--accent-cyan); padding: 12px 24px; border-radius: 8px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2000; display: flex; align-items: center; gap: 8px; font-size: 11px; border: 1px solid var(--glass-border); font-family: 'Orbitron', sans-serif; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        #toast.show { bottom: 35px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-box { background: #05070a; padding: 24px; border-radius: 12px; text-align: center; max-width: 310px; border: 1px solid var(--glass-border); color: #fff; }
        .modal-btn-group { display: flex; gap: 10px; margin-top: 18px; }
        .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; font-family: 'Orbitron', sans-serif; transition: all 0.2s; text-transform: uppercase; }
        .modal-btn.cancel { background: #1e293b; color: #fff; }
        .modal-btn.confirm { background: var(--neon-pink); color: white; }

        /* ডাইনামিক সিঙ্গেল স্ক্রোল নেভিগেশন বাটন */
        .scroll-nav-container {
            position: fixed;
            bottom: 25px;
            right: 18px;
            z-index: 9999;
            display: none; /* ডিফল্টভাবে লুকানো থাকবে */
        }

        .scroll-nav-btn {
            background: #05070a;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex; 
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.25);
        }
        .scroll-nav-btn:hover { background: var(--accent-cyan); color: #000; transform: scale(1.1); box-shadow: 0 0 20px var(--accent-cyan); }
    </style>
</head>
<body>

<!-- স্মার্ট স্ক্রোল বাটন (আউটপুট আসলেই দেখা যাবে) -->
<div class="scroll-nav-container" id="scrollNavContainer">
    <button class="scroll-nav-btn" id="dynamicScrollBtn" onclick="toggleScrollAction()" title="Scroll Navigation">
        <i class="fa-solid fa-angles-down" id="scrollIcon"></i>
    </button>
</div>

<div class="container" id="mainContainer">
    <header>
        <div class="brand-section">
            <div class="brand-badge">RJ</div>
            <div class="brand-text-container">
                <h1 class="brand-title">SCRIPT STUDIO</h1>
                <span class="brand-subtitle">SMART SCRIPT SPLITTER</span>
            </div>
        </div>
    </header>
    
    <div id="cut" class="content glass-panel">
        <div class="panel-header">
            <label class="file-label" for="fileInputCut">
                <i class="fa-solid fa-file-arrow-up"></i> UPLOAD TXT FILE
            </label>
            <div id="cutWords" class="word-count-top">Words: 0</div>
        </div>
        <input type="file" id="fileInputCut" accept=".txt" style="display:none;" onchange="handleFileUpload(this, 'cutInput')">
        
        <div class="input-wrapper">
            <textarea id="cutInput" placeholder="Write or paste your full story here..."></textarea>
            <div class="action-tray">
                <button id="btnDelCut" class="icon-btn delete" onclick="showPopup('cut')" title="Clear All">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="glass-panel" style="padding: 10px 12px;">
        <div class="search-row">
            <div class="search-input-wrapper">
                <input type="text" id="charName" placeholder="Character Name (আবির)" oninput="saveData('charName');">
            </div>
            <button class="extract-btn" onclick="extractDialogs()">
                <i class="fa-solid fa-bolt-lightning"></i> Extract
            </button>
        </div>
    </div>
    
    <div id="cutCounter" class="counter-text"></div>
    <div id="cutResult" class="result-box"></div>
    
    <div id="cutActions" class="btn-group">
        <button class="cut-btn" onclick="cutContent('cutResult')">
            <i class="fa-solid fa-scissors"></i> Cut Dialogs
        </button>
        <button class="download-btn" onclick="downloadTxt('cutResult', 'dialogs.txt')">
            <i class="fa-solid fa-cloud-arrow-down"></i> Download
        </button>
    </div>

    <div class="undo-btn-wrapper">
        <button id="undoBtn" class="undo-btn" onclick="handleUndo()">
            <i class="fa-solid fa-rotate-left"></i> Rollback Cut 
        </button>
    </div>
</div>

<div id="deleteModal" class="modal-overlay">
    <div class="modal-box">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:32px; color:var(--neon-pink);"></i>
        <p style="font-family:'Orbitron', sans-serif; font-weight:700; font-size:12px; margin:14px 0;">WIPE ALL TERMINAL DATA?</p>
        <div class="modal-btn-group">
            <button class="modal-btn cancel" onclick="closePopup()">CANCEL</button>
            <button id="confirmDelBtn" class="modal-btn confirm">WIPE DATA</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    let currentDeleteType = '';
    let historyState = null; 
    let currentExtractedBlocksIndices = []; 
    let pureExtractedText = ""; 
    let extractedDialogIndicesOnly = []; 
    let isAtBottom = false;

    window.onload = function() {
        ['cutInput', 'charName'].forEach(id => {
            const saved = localStorage.getItem(id);
            if(saved) {
                document.getElementById(id).value = saved;
                if(id.includes('Input')) {
                    updateWordCount(id, 'cutWords');
                    toggleClearBtn(id, 'btnDelCut');
                }
            }
        });

        document.getElementById('cutInput').addEventListener('input', function() {
            onInputUpdate('cutInput', 'cutWords', 'btnDelCut');
        });

        if(document.getElementById('cutInput').value && document.getElementById('charName').value) extractDialogs(true);
        
        window.addEventListener('scroll', updateScrollButtonState);
    }

    /* ডায়নামিক স্ক্রোল এবং ভিজিবিলিটি লজিক */
    function updateScrollButtonState() {
        const scrollNav = document.getElementById('scrollNavContainer');
        const res = document.getElementById('cutResult');

        // আউটপুট বক্স দৃশ্যমান থাকলে তবেই স্ক্রোল বাটন দেখাবে
        if (res && res.style.display === 'block') {
            scrollNav.style.display = 'block';
        } else {
            scrollNav.style.display = 'none';
            return;
        }

        const icon = document.getElementById('scrollIcon');
        const scrollPosition = window.innerHeight + window.scrollY;
        const threshold = document.documentElement.scrollHeight - 100;

        if (scrollPosition >= threshold) {
            isAtBottom = true;
            icon.className = "fa-solid fa-angles-up";
        } else {
            isAtBottom = false;
            icon.className = "fa-solid fa-angles-down";
        }
    }

    function toggleScrollAction() {
        if (isAtBottom) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            window.scrollTo({ 
                top: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight), 
                behavior: 'smooth' 
            });
        }
    }

    function cleanBengaliText(str) {
        if (!str) return "";
        return str.trim().normalize("NFC");
    }

    function buildBengaliFlexibleRegex(name) {
        let normalized = name.normalize("NFC");
        let escaped = normalized.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        
        let flexible = escaped
            .replace(/(য়|য়্|য\u09BC)/g, "(য়|য\u09BC)")
            .replace(/ো/g, "(ো|ে\u200B*া)")
            .replace(/ে\u200B*া/g, "(ো|ে\u200B*া)")
            .replace(/\u09CB/g, "(\u09CB|\u09C7\u200B*\u09BE)")
            .replace(/\u09C7\u200B*\u09BE/g, "(\u09CB|\u09C7\u200B*\u09BE)");
            
        return flexible;
    }

    function onInputUpdate(inputId, wordId, btnId) { 
        saveData(inputId); 
        updateWordCount(inputId, wordId); 
        toggleClearBtn(inputId, btnId);
    }

    function toggleClearBtn(inputId, btnId) {
        const val = document.getElementById(inputId).value.trim();
        document.getElementById(btnId).style.display = val.length > 0 ? "flex" : "none";
    }

    function updateWordCount(inputId, wordId) {
        const text = document.getElementById(inputId).value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        document.getElementById(wordId).innerText = "Words: " + words;
    }

    function saveData(id) { localStorage.setItem(id, document.getElementById(id).value); }

    function showPopup(type) { 
        currentDeleteType = type; 
        document.getElementById('deleteModal').style.display = 'flex';
        document.getElementById('confirmDelBtn').onclick = function() { fullClear(currentDeleteType); closePopup(); }; 
    }
    function closePopup() { document.getElementById('deleteModal').style.display = 'none'; }

    function fullClear(type) {
        ['cutInput', 'charName'].forEach(id => { document.getElementById(id).value = ""; localStorage.removeItem(id); });
        document.getElementById('cutResult').style.display = 'none';
        document.getElementById('cutCounter').style.display = 'none';
        document.getElementById('cutActions').style.display = 'none';
        document.getElementById('undoBtn').style.display = 'none';
        historyState = null;
        currentExtractedBlocksIndices = [];
        extractedDialogIndicesOnly = [];
        pureExtractedText = "";
        updateWordCount('cutInput', 'cutWords');
        toggleClearBtn('cutInput', 'btnDelCut');
        updateScrollButtonState(); // স্ক্রোল বাটন হাইড করার জন্য
        showToast("System cleaned!");
    }

    function handleFileUpload(input, targetId) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById(targetId).value = e.target.result; 
                onInputUpdate(targetId, 'cutWords', 'btnDelCut');
                extractDialogs(true);
                showToast("File injected successfully!");
            };
            reader.readAsText(file);
        }
    }

    function extractDialogs(isInitialLoad = false) {
        if (document.getElementById('undoBtn').style.display === 'inline-flex' && isInitialLoad) return;

        const text = document.getElementById('cutInput').value;
        const name = document.getElementById('charName').value.trim();
        const res = document.getElementById('cutResult');
        const ctr = document.getElementById('cutCounter');
        const acts = document.getElementById('cutActions');

        if(!name || !text.trim()) {
            res.style.display = 'none'; ctr.style.display = 'none'; acts.style.display = 'none';
            updateScrollButtonState();
            return;
        }

        const cleanedTargetName = cleanBengaliText(name);
        const flexiblePattern = buildBengaliFlexibleRegex(cleanedTargetName);
        const blocks = text.split(/\n\s*\n/);
        
        let tempOutput = [];
        let totalDialogsCount = 0;
        currentExtractedBlocksIndices = []; 
        extractedDialogIndicesOnly = []; 

        const dynamicRegex = new RegExp('^([^\\p{L}\\p{N}]*)(' + flexiblePattern + ')', 'iu');

        for (let i = 0; i < blocks.length; i++) {
            const rawBlock = blocks[i];
            const trimmedBlock = rawBlock.trim().normalize("NFC");
            
            if (trimmedBlock.startsWith('#')) {
                tempOutput.push({ type: 'hash', index: i, text: trimmedBlock });
                continue;
            }

            const match = trimmedBlock.match(dynamicRegex);
            
            if (match) {
                totalDialogsCount++;
                
                const prefixSymbols = match[1]; 
                const matchedName = match[2];     
                
                const matchedLength = prefixSymbols.length + matchedName.length;
                const restOfBlock = trimmedBlock.substring(matchedLength);
                
                const formattedText = prefixSymbols + '<span class="highlight-red">' + matchedName + '</span>' + restOfBlock;
                
                tempOutput.push({ type: 'dialog', index: i, text: formattedText, rawText: trimmedBlock });
                continue;
            }
            tempOutput.push({ type: 'other', index: i });
        }

        let html = "";
        let rawTextForCounting = "";
        let textForCopyAndDownload = ""; 

        for (let i = 0; i < tempOutput.length; i++) {
            if (tempOutput[i].type === 'hash') {
                let hasDialog = false;
                for (let j = i + 1; j < tempOutput.length; j++) {
                    if (tempOutput[j].type === 'hash') break; 
                    if (tempOutput[j].type === 'dialog') { hasDialog = true; break; }
                }
                if (hasDialog) {
                    html += '<span class="highlight-hash">' + tempOutput[i].text + '</span>' + "\n\n";
                    rawTextForCounting += tempOutput[i].text + " ";
                    textForCopyAndDownload += tempOutput[i].text + "\n\n";
                    currentExtractedBlocksIndices.push(tempOutput[i].index);
                }
            } else if (tempOutput[i].type === 'dialog') {
                html += tempOutput[i].text + "\n\n";
                rawTextForCounting += tempOutput[i].rawText + " ";
                
                let plainDialog = tempOutput[i].text.replace(/<\/?[^>]+(>|$)/g, "");
                textForCopyAndDownload += plainDialog + "\n\n";
                currentExtractedBlocksIndices.push(tempOutput[i].index);
                extractedDialogIndicesOnly.push(tempOutput[i].index); 
            }
        }

        pureExtractedText = textForCopyAndDownload.trim();
        const totalOutputWords = rawTextForCounting.trim() ? rawTextForCounting.trim().split(/\s+/).length : 0;

        if(totalDialogsCount > 0 || html.length > 0) {
            ctr.innerText = "TOTAL DIALOGUES MATCHED: " + totalDialogsCount; ctr.style.display = "block";
            res.innerHTML = '<span class="highlight-meta">TOTAL EXTRACTED WORDS: ' + totalOutputWords + '</span>' + html; 
            res.style.display = "block";
            acts.style.display = "grid";
        } else {
            if(!isInitialLoad) showToast("No dialogue matched!", "error");
            res.style.display = 'none'; ctr.style.display = 'none'; acts.style.display = 'none';
        }

        // আউটপুট লোড হওয়ার সাথে সাথে স্ক্রোল বাটনের স্ট্যাটাস আপডেট
        updateScrollButtonState();
    }

    function fallbackCopyText(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";  
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            document.body.removeChild(textArea);
            return true;
        } catch (err) {
            document.body.removeChild(textArea);
            return false;
        }
    }

    function cutContent(id) { 
        const textInput = document.getElementById('cutInput');
        const resBox = document.getElementById(id);
        if(!pureExtractedText || !textInput.value.trim()) return;

        historyState = {
            mainText: textInput.value,
            resultHtml: resBox.innerHTML,
            counterText: document.getElementById('cutCounter').innerText
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pureExtractedText)
                .then(() => executeCutLogic())
                .catch(() => {
                    if(fallbackCopyText(pureExtractedText)) executeCutLogic();
                    else showToast("Failed to copy/cut", "error");
                });
        } else {
            if(fallbackCopyText(pureExtractedText)) executeCutLogic();
            else showToast("Failed to copy/cut", "error");
        }
    }

    function executeCutLogic() {
        const textInput = document.getElementById('cutInput');
        const originalBlocks = textInput.value.split(/\n\s*\n/);
        const remainingBlocks = originalBlocks.filter((block, idx) => !extractedDialogIndicesOnly.includes(idx));

        textInput.value = remainingBlocks.join("\n\n");
        saveData('cutInput');
        updateWordCount('cutInput', 'cutWords');
        toggleClearBtn('cutInput', 'btnDelCut');
        
        document.getElementById('cutResult').style.display = 'none';
        document.getElementById('cutCounter').style.display = 'none';
        document.getElementById('cutActions').style.display = 'none';
        document.getElementById('undoBtn').style.display = 'inline-flex';
        
        // কাট করার পর আউটপুট হাইড হলে স্ক্রোল বাটনও অটো হাইড হবে
        updateScrollButtonState();
        showToast("Cut & Copy success!");
    }

    function handleUndo() {
        if (historyState) {
            document.getElementById('cutInput').value = historyState.mainText;
            saveData('cutInput');
            updateWordCount('cutInput', 'cutWords');
            toggleClearBtn('cutInput', 'btnDelCut');

            document.getElementById('cutResult').innerHTML = historyState.resultHtml;
            document.getElementById('cutResult').style.display = 'block';
            document.getElementById('cutCounter').innerText = historyState.counterText;
            document.getElementById('cutCounter').style.display = 'block';
            document.getElementById('cutActions').style.display = 'grid';
            document.getElementById('undoBtn').style.display = 'none';
            historyState = null;
            
            // রোলব্যাক করার পর আউটপুট আবার দেখা গেলে স্ক্রোল বাটন শো করবে
            updateScrollButtonState();
            showToast("Rollback success!");
        }
    }

    function downloadTxt(id, filename) {
        if(!pureExtractedText) return;
        const blob = new Blob([pureExtractedText], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        showToast("Download started...");
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        toast.style.color = type === 'error' ? 'var(--neon-pink)' : 'var(--accent-cyan)';
        toast.innerHTML = (type === 'error' ? '<i class="fa-solid fa-circle-xmark"></i> ' : '<i class="fa-solid fa-circle-check"></i> ') + msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
</script>
