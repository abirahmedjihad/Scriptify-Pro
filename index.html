<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCRIPTIFY PRO - Premium Glass Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b11; 
            --panel-bg: rgba(15, 23, 42, 0.65);
            --accent-color: #00ffaa; 
            --cyber-cyan: #00f0ff; 
            --neon-pink: #ff007f;  
            --text-color: #e2e8f0; 
            --text-muted: #64748b;
            --glass-border: rgba(255, 255, 255, 0.08);
            --active-border: rgba(0, 255, 170, 0.4);
            --glow: 0 0 25px rgba(0, 255, 170, 0.15);
        }

        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            overflow: hidden; 
            touch-action: none;
            position: relative;
        }

        body { 
            font-family: 'Fira Code', monospace; 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 127, 0.05) 0px, transparent 50%);
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #04060a;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .boot-loader {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            max-width: 320px;
            width: 85%;
        }
        .boot-title {
            color: var(--accent-color);
            font-size: 22px;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color), var(--cyber-cyan));
            box-shadow: 0 0 15px var(--accent-color);
            animation: fillProgress 1s cubic-bezier(0.1, 0.5, 0.1, 1) forwards;
        }
        .boot-status {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        @keyframes fillProgress { 100% { width: 100%; } }

        .container { 
            flex: 1; 
            padding: 25px; 
            max-width: 800px; 
            margin: 0 auto; 
            width: 100%; 
            box-sizing: border-box; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            z-index: 10;
        }
        
        .content { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        h1.brand-title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 26px;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0 30px 0;
            font-weight: 900;
        }
        
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--glow);
        }

        .input-wrapper { position: relative; }

        textarea { 
            width: 100%; 
            height: 280px; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid var(--glass-border); 
            border-radius: 12px; 
            padding: 18px; 
            padding-right: 50px; 
            box-sizing: border-box; 
            font-size: 15px; 
            color: var(--text-color);
            outline: none; 
            resize: none; 
            display: block; 
            transition: all 0.3s; 
            font-family: inherit;
            line-height: 1.6;
        }
        
        textarea:focus {
            border-color: var(--active-border);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.1);
        }
        
        .action-tray { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            z-index: 10; 
        }
        
        .icon-btn { 
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--neon-pink);
            border-radius: 8px;
            width: 38px; 
            height: 38px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 16px; 
            color: var(--neon-pink); 
            transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 15px var(--neon-pink); }
        .icon-btn.delete { display: none; }
        
        .word-count { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--cyber-cyan); text-align: right; margin-top: 8px; font-weight: 600; }
        
        input[type="text"] { width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); padding: 16px; border-radius: 12px; box-sizing: border-box; outline: none; font-size: 15px; color: var(--accent-color); font-family: inherit; transition: all 0.3s; }
        input[type="text"]:focus { border-color: var(--active-border); box-shadow: 0 0 15px rgba(0, 255, 170, 0.1); }

        .main-btn { 
            background: linear-gradient(135deg, var(--accent-color), var(--cyber-cyan)); 
            color: #04060a; 
            border: none;
            padding: 18px; 
            border-radius: 12px; 
            font-weight: 700; 
            width: 100%; 
            font-size: 15px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-transform: uppercase; 
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            transition: all 0.3s; 
            box-shadow: 0 4px 20px rgba(0, 255, 170, 0.25);
        }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 255, 170, 0.4); }
        .main-btn:active { transform: translateY(0); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; display: none; }
        
        .cut-btn { background: transparent; color: var(--cyber-cyan); border: 1px solid var(--cyber-cyan); padding: 15px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-family: 'Orbitron', sans-serif; transition: all 0.3s; }
        .cut-btn:hover { background: var(--cyber-cyan); color: #000; box-shadow: 0 0 15px var(--cyber-cyan); }

        .download-btn { background: transparent; color: #cc66ff; border: 1px solid #cc66ff; padding: 15px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-family: 'Orbitron', sans-serif; transition: all 0.3s; }
        .download-btn:hover { background: #cc66ff; color: #fff; box-shadow: 0 0 15px #cc66ff; }
        
        .undo-btn-wrapper { display: flex; justify-content: center; margin-top: 15px; }
        .undo-btn { display: none; background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; align-items: center; gap: 8px; font-size: 13px; font-family: 'Orbitron', sans-serif; transition: all 0.2s; }
        .undo-btn:hover { background: #334155; }

        .result-box { background: rgba(0, 0, 0, 0.3); border: 1px dashed var(--accent-color); padding: 20px; white-space: pre-wrap; border-radius: 12px; font-size: 15px; margin-top: 20px; display: none; color: var(--text-color); line-height: 1.7; }
        
        .highlight-red { color: var(--neon-pink); font-weight: 700; text-shadow: 0 0 8px rgba(255, 0, 127, 0.3); }
        .highlight-hash { color: var(--cyber-cyan); font-weight: 600; }
        .highlight-meta { color: var(--accent-color); font-weight: 600; display: block; border-bottom: 1px dashed var(--glass-border); padding-bottom: 8px; margin-bottom: 12px; font-family: 'Orbitron', sans-serif; font-size: 13px; }

        .counter-text { text-align: center; color: var(--accent-color); font-weight: 600; margin: 15px 0 5px 0; display: none; font-size: 13px; font-family: 'Orbitron', sans-serif; }

        .file-label { cursor: pointer; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.03); color: var(--accent-color); padding: 10px 16px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--glass-border); margin-bottom: 12px; font-family: 'Orbitron', sans-serif; transition: all 0.3s; }
        .file-label:hover { background: rgba(0, 255, 170, 0.08); border-color: var(--accent-color); }

        #toast { position: fixed; bottom: -70px; left: 50%; transform: translateX(-50%); background: #0f172a; color: var(--accent-color); padding: 14px 28px; border-radius: 10px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2000; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 13px; border: 1px solid var(--glass-border); font-family: 'Orbitron', sans-serif; }
        #toast.show { bottom: 40px; }
        
        footer { text-align: center; padding: 20px; font-size: 11px; background: rgba(4, 6, 10, 0.8); border-top: 1px solid var(--glass-border); margin-top: auto; color: var(--text-muted); letter-spacing: 1px; z-index: 10; }
        footer a { color: var(--cyber-cyan); text-decoration: none; font-weight: 600; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-box { background: #0f172a; padding: 25px; border-radius: 16px; text-align: center; max-width: 320px; border: 1px solid var(--glass-border); color: #fff; }
        .modal-btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; font-family: 'Orbitron', sans-serif; transition: all 0.2s; }
        .modal-btn.cancel { background: #1e293b; color: #fff; }
        .modal-btn.confirm { background: var(--neon-pink); color: white; }

        .scroll-down-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            color: var(--accent-color);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: none; 
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .scroll-down-btn:hover { background: var(--accent-color); color: #000; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="boot-loader">
        <div class="boot-title"><i class="fas fa-terminal"></i> SCRIPTIFY OS</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
        <div id="bootStatusText" class="boot-status">LOADING ENGINE...</div>
    </div>
</div>

<button id="scrollBtn" class="scroll-down-btn" onclick="scrollToBottom()">
    <i class="fas fa-chevron-down"></i>
</button>

<div class="container" id="mainContainer">
    <h1 class="brand-title">Scriptify Pro</h1>
    
    <div id="cut" class="content glass-panel">
        <label class="file-label" for="fileInputCut">
            <i class="fas fa-cloud-upload-alt"></i> INJECT TXT
        </label>
        <input type="file" id="fileInputCut" accept=".txt" style="display:none;" onchange="handleFileUpload(this, 'cutInput')">
        
        <div class="input-wrapper">
            <textarea id="cutInput" placeholder="// এখানে আপনার গল্প বা স্ক্রিপ্ট পেস্ট করুন..."></textarea>
            <div class="action-tray">
                <button id="btnDelCut" class="icon-btn delete" onclick="showPopup('cut')">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
        <div id="cutWords" class="word-count">Words: 0</div>
    </div>

    <div class="glass-panel">
        <input type="text" id="charName" placeholder="চরিত্রের নাম লিখুন (যেমন: আবির)" oninput="saveData('charName');" style="margin-bottom: 15px;">
        <button class="main-btn" onclick="extractDialogs()">
            <i class="fas fa-play"></i> Run Extraction
        </button>
    </div>
    
    <div id="cutCounter" class="counter-text"></div>
    <div id="cutResult" class="result-box glass-panel"></div>
    
    <div id="cutActions" class="btn-group">
        <button class="cut-btn" onclick="cutContent('cutResult')">
            <i class="fas fa-cut"></i> Cut Dialogs
        </button>
        <button class="download-btn" onclick="downloadTxt('cutResult', 'dialogs.txt')">
            <i class="fas fa-download"></i> Download
        </button>
    </div>

    <div class="undo-btn-wrapper">
        <button id="undoBtn" class="undo-btn" onclick="handleUndo()">
            <i class="fas fa-undo"></i> Rollback Cut 
        </button>
    </div>
</div>

<div id="deleteModal" class="modal-overlay">
    <div class="modal-box">
        <i class="fas fa-exclamation-circle" style="font-size:35px; color:var(--neon-pink);"></i>
        <p style="font-family:'Orbitron', sans-serif; font-weight:600; font-size:14px; margin:15px 0;">WIPE ALL TERMINAL DATA?</p>
        <div class="modal-btn-group">
            <button class="modal-btn cancel" onclick="closePopup()">না</button>
            <button id="confirmDelBtn" class="modal-btn confirm">হ্যাঁ</button>
        </div>
    </div>
</div>
<div id="toast"></div>

<footer>
    SYSTEM DEV : <a href="https://www.facebook.com/share/1D2uhwVQDq/" target="_blank">ABIR AHMED JIHAD</a>
</footer>

<script>
    let currentDeleteType = '';
    let historyState = null; 
    let currentExtractedBlocksIndices = []; 
    let pureExtractedText = ""; 
    let extractedDialogIndicesOnly = []; 

    window.onload = function() {
        runSplashLogs();

        ['cutInput', 'charName'].forEach(id => {
            const saved = localStorage.getItem(id);
            if(saved) {
                document.getElementById(id).value = saved;
                if(id.includes('Input')) {
                    updateWordCount(id, 'cutWords');
                    toggleClearBtn(id, 'btnDelCut');
                }
            }
        });
        document.getElementById('cutInput').addEventListener('input', function() {
            onInputUpdate('cutInput', 'cutWords', 'btnDelCut');
        });
        if(document.getElementById('cutInput').value && document.getElementById('charName').value) extractDialogs(true);
    }

    function scrollToBottom() {
        const container = document.getElementById('mainContainer');
        container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }

    function toggleScrollBtn() {
        const resBox = document.getElementById('cutResult');
        const scrollBtn = document.getElementById('scrollBtn');
        scrollBtn.style.display = (resBox && resBox.style.display === 'block') ? 'flex' : 'none';
    }

    function runSplashLogs() {
        const statusText = document.getElementById('bootStatusText');
        const logs = ["INITIALIZING...", "NORMALIZING TEXT ENGINE...", "READY!"];
        logs.forEach((log, index) => {
            setTimeout(() => { if(statusText) statusText.innerText = log; }, index * 300);
        });
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }
        }, 1000);
    }

    // টাইপিং মিস্টেক (ভুল ও-কার বা কোড ক্যারেক্টার) ঠিক করার নিখুঁত ফাংশন
    function cleanBengaliText(str) {
        if (!str) return "";
        let cleaned = str.normalize("NFC");
        // এ-কার (\u09c7) এবং আকার (\u09be) আলাদাভাবে টাইপ করা থাকলে তা ও-কার (\u09cb) এ রুপান্তর করে
        cleaned = cleaned.replace(/\u09c7\u09be/g, "\u09cb");
        return cleaned.trim();
    }

    function onInputUpdate(inputId, wordId, btnId) { 
        saveData(inputId); 
        updateWordCount(inputId, wordId); 
        toggleClearBtn(inputId, btnId);
    }

    function toggleClearBtn(inputId, btnId) {
        const val = document.getElementById(inputId).value.trim();
        document.getElementById(btnId).style.display = val.length > 0 ? "flex" : "none";
    }

    function updateWordCount(inputId, wordId) {
        const text = document.getElementById(inputId).value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        document.getElementById(wordId).innerText = "Words: " + words;
    }

    function saveData(id) { localStorage.setItem(id, document.getElementById(id).value); }

    function showPopup(type) { 
        currentDeleteType = type; 
        document.getElementById('deleteModal').style.display = 'flex';
        document.getElementById('confirmDelBtn').onclick = function() { fullClear(currentDeleteType); closePopup(); }; 
    }
    function closePopup() { document.getElementById('deleteModal').style.display = 'none'; }

    function fullClear(type) {
        ['cutInput', 'charName'].forEach(id => { document.getElementById(id).value = ""; localStorage.removeItem(id); });
        document.getElementById('cutResult').style.display = 'none';
        document.getElementById('cutCounter').style.display = 'none';
        document.getElementById('cutActions').style.display = 'none';
        document.getElementById('undoBtn').style.display = 'none';
        historyState = null;
        currentExtractedBlocksIndices = [];
        extractedDialogIndicesOnly = [];
        pureExtractedText = "";
        updateWordCount('cutInput', 'cutWords');
        toggleClearBtn('cutInput', 'btnDelCut');
        toggleScrollBtn();
        showToast("সিস্টেম ক্লিন করা হয়েছে!");
    }

    function handleFileUpload(input, targetId) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById(targetId).value = e.target.result; 
                onInputUpdate(targetId, 'cutWords', 'btnDelCut');
                extractDialogs(true);
                showToast("ফাইল ইনজেক্ট সফল!");
            };
            reader.readAsText(file);
        }
    }

    function extractDialogs(isInitialLoad = false) {
        if (document.getElementById('undoBtn').style.display === 'inline-flex' && isInitialLoad) return;

        const text = document.getElementById('cutInput').value;
        const name = document.getElementById('charName').value.trim();
        const res = document.getElementById('cutResult');
        const ctr = document.getElementById('cutCounter');
        const acts = document.getElementById('cutActions');

        if(!name || !text.trim()) {
            res.style.display = 'none'; ctr.style.display = 'none'; acts.style.display = 'none';
            toggleScrollBtn();
            return;
        }

        const normalizedTargetName = cleanBengaliText(name).toLowerCase();
        const blocks = text.split(/\n\s*\n/);
        
        let tempOutput = [];
        let totalDialogsCount = 0;
        currentExtractedBlocksIndices = []; 
        extractedDialogIndicesOnly = []; 

        for (let i = 0; i < blocks.length; i++) {
            const rawBlock = blocks[i];
            const trimmedBlock = rawBlock.trim();
            
            if (trimmedBlock.startsWith('#')) {
                tempOutput.push({ type: 'hash', index: i, text: trimmedBlock });
                continue;
            }

            // ফিক্সড রেগুলার এক্সপ্রেশন: [\p{L}\p{M}]+ ব্যবহার করে বাংলার সমস্ত কার, স্বরচিহ্ন ও যুক্তাক্ষর ধরা হয়েছে
            const match = trimmedBlock.match(/^([^\p{L}\p{N}]*)([\p{L}\p{M}]+)/u);
            
            if (match) {
                const prefixSymbols = match[1]; 
                const firstWord = match[2];     
                
                if (cleanBengaliText(firstWord).toLowerCase() === normalizedTargetName) {
                    totalDialogsCount++;
                    
                    const matchedLength = prefixSymbols.length + firstWord.length;
                    const restOfBlock = trimmedBlock.substring(matchedLength);
                    
                    const formattedText = prefixSymbols + '<span class="highlight-red">' + firstWord + '</span>' + restOfBlock;
                    
                    tempOutput.push({ type: 'dialog', index: i, text: formattedText, rawText: trimmedBlock });
                    continue;
                }
            }
            tempOutput.push({ type: 'other', index: i });
        }

        let html = "";
        let rawTextForCounting = "";
        let textForCopyAndDownload = ""; 

        for (let i = 0; i < tempOutput.length; i++) {
            if (tempOutput[i].type === 'hash') {
                let hasDialog = false;
                for (let j = i + 1; j < tempOutput.length; j++) {
                    if (tempOutput[j].type === 'hash') break; 
                    if (tempOutput[j].type === 'dialog') { hasDialog = true; break; }
                }
                if (hasDialog) {
                    html += '<span class="highlight-hash">' + tempOutput[i].text + '</span>' + "\n\n";
                    rawTextForCounting += tempOutput[i].text + " ";
                    textForCopyAndDownload += tempOutput[i].text + "\n\n";
                    currentExtractedBlocksIndices.push(tempOutput[i].index);
                }
            } else if (tempOutput[i].type === 'dialog') {
                html += tempOutput[i].text + "\n\n";
                rawTextForCounting += tempOutput[i].rawText + " ";
                
                let plainDialog = tempOutput[i].text.replace(/<\/?[^>]+(>|$)/g, "");
                textForCopyAndDownload += plainDialog + "\n\n";
                currentExtractedBlocksIndices.push(tempOutput[i].index);
                extractedDialogIndicesOnly.push(tempOutput[i].index); 
            }
        }

        pureExtractedText = textForCopyAndDownload.trim();
        const totalOutputWords = rawTextForCounting.trim() ? rawTextForCounting.trim().split(/\s+/).length : 0;

        if(totalDialogsCount > 0 || html.length > 0) {
            ctr.innerText = "TOTAL DIALOGS MATCHED: " + totalDialogsCount; ctr.style.display = "block";
            res.innerHTML = '<span class="highlight-meta">TOTAL EXTRACTED WORDS: ' + totalOutputWords + '</span>' + html; 
            res.style.display = "block";
            acts.style.display = "grid";
        } else {
            if(!isInitialLoad) showToast("কোনো ডায়লগ ম্যাচ করেনি!", "error");
            res.style.display = 'none'; ctr.style.display = 'none'; acts.style.display = 'none';
        }
        toggleScrollBtn();
    }

    function fallbackCopyText(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";  
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            document.body.removeChild(textArea);
            return true;
        } catch (err) {
            document.body.removeChild(textArea);
            return false;
        }
    }

    function cutContent(id) { 
        const textInput = document.getElementById('cutInput');
        const resBox = document.getElementById(id);
        if(!pureExtractedText || !textInput.value.trim()) return;

        historyState = {
            mainText: textInput.value,
            resultHtml: resBox.innerHTML,
            counterText: document.getElementById('cutCounter').innerText
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pureExtractedText)
                .then(() => executeCutLogic())
                .catch(() => {
                    if(fallbackCopyText(pureExtractedText)) executeCutLogic();
                    else showToast("কাট করতে সমস্যা হয়েছে", "error");
                });
        } else {
            if(fallbackCopyText(pureExtractedText)) executeCutLogic();
            else showToast("কাট করতে সমস্যা হয়েছে", "error");
        }
    }

    function executeCutLogic() {
        const textInput = document.getElementById('cutInput');
        const originalBlocks = textInput.value.split(/\n\s*\n/);
        const remainingBlocks = originalBlocks.filter((block, idx) => !extractedDialogIndicesOnly.includes(idx));

        textInput.value = remainingBlocks.join("\n\n");
        saveData('cutInput');
        updateWordCount('cutInput', 'cutWords');
        toggleClearBtn('cutInput', 'btnDelCut');
        
        document.getElementById('cutResult').style.display = 'none';
        document.getElementById('cutCounter').style.display = 'none';
        document.getElementById('cutActions').style.display = 'none';
        document.getElementById('undoBtn').style.display = 'inline-flex';
        toggleScrollBtn();
        showToast("কপি ও কাট সফল হয়েছে!");
    }

    function handleUndo() {
        if (historyState) {
            document.getElementById('cutInput').value = historyState.mainText;
            saveData('cutInput');
            updateWordCount('cutInput', 'cutWords');
            toggleClearBtn('cutInput', 'btnDelCut');

            document.getElementById('cutResult').innerHTML = historyState.resultHtml;
            document.getElementById('cutResult').style.display = 'block';
            document.getElementById('cutCounter').innerText = historyState.counterText;
            document.getElementById('cutCounter').style.display = 'block';
            document.getElementById('cutActions').style.display = 'grid';
            document.getElementById('undoBtn').style.display = 'none';
            historyState = null;
            toggleScrollBtn();
            showToast("সিস্টেম রোলব্যাক সফল!");
        }
    }

    function downloadTxt(id, filename) {
        if(!pureExtractedText) return;
        const blob = new Blob([pureExtractedText], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        showToast("ডাউনলোড শুরু হয়েছে...");
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        toast.style.color = type === 'error' ? 'var(--neon-pink)' : 'var(--accent-color)';
        toast.innerHTML = (type === 'error' ? '<i class="fas fa-times-circle"></i> ' : '<i class="fas fa-check-circle"></i> ') + msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
