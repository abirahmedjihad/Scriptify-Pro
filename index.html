<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCRIPTIFY PRO - Script Splitter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b11; 
            --panel-bg: #000000; /* সম্পূর্ণ ডাইরেক্ট কালো */
            --accent-color: #38bdf8; 
            --cyber-cyan: #00f0ff; 
            --neon-pink: #ff007f;  
            --text-color: #e2e8f0; 
            --text-muted: #64748b;
            --glass-border: rgba(255, 255, 255, 0.08);
            --active-border: rgba(56, 189, 248, 0.4);
        }

        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            overflow: hidden; 
            touch-action: none;
            position: relative;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.02) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 127, 0.02) 0px, transparent 50%);
        }

        .container { 
            flex: 1; 
            padding: 15px 12px; 
            max-width: 100%; 
            margin: 0; 
            width: 100%; 
            box-sizing: border-box; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            z-index: 10;
        }
        
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            color: #38bdf8;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #e2e8f0;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-subtitle {
            font-size: 9px;
            background: rgba(56, 189, 248, 0.08);
            color: #38bdf8;
            padding: 3px 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }
        
        .glass-panel {
            background: var(--panel-bg);
            border: none; /* ব্যাকগ্রাউন্ডের বর্ডার বাদ দেওয়া হয়েছে */
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        .input-wrapper { position: relative; width: 100%; }

        textarea { 
            width: 100%; 
            height: 380px; 
            background: #000000; /* ইনপুট বক্স ডাইরেক্ট কালো */
            border: none; /* ইনপুট বক্সের বর্ডার বাদ */
            border-radius: 8px; 
            padding: 15px; 
            padding-right: 50px; 
            box-sizing: border-box; 
            font-size: 14px; 
            color: var(--text-color);
            outline: none; 
            resize: none; 
            display: block; 
            transition: border-color 0.3s; 
            font-family: 'Fira Code', monospace;
            line-height: 1.6;
        }
        
        textarea:focus {
            border: 1px solid var(--active-border); /* ফোকাস করলে হালকা বর্ডার আসবে চেনার সুবিধার্থে */
        }
        
        .action-tray { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            z-index: 10; 
        }
        
        .icon-btn { 
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--neon-pink);
            border-radius: 6px;
            width: 38px; 
            height: 38px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 16px; 
            color: var(--neon-pink); 
            transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--neon-pink); color: #fff; }
        .icon-btn.delete { display: none; }
        
        .word-count { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--cyber-cyan); text-align: right; margin-top: 8px; font-weight: 600; }
        
        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .search-input-wrapper {
            flex: 1;
        }

        input[type="text"] { 
            width: 100%; 
            background: #000000; /* সার্চ বক্স ডাইরেক্ট কালো */
            border: none; /* সার্চ বক্সের বর্ডার বাদ */
            padding: 12px 14px; 
            border-radius: 8px; 
            box-sizing: border-box; 
            outline: none; 
            font-size: 14px; 
            color: #ffffff; 
            font-family: inherit; 
            transition: border-color 0.3s; 
        }
        input[type="text"]:focus { border: 1px solid var(--active-border); }

        .extract-btn {
            background: #38bdf8;
            color: #04060a;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
            height: 44px;
            box-sizing: border-box;
        }
        .extract-btn:hover { opacity: 0.9; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; display: none; }
        
        .cut-btn { background: transparent; color: var(--cyber-cyan); border: 1px solid var(--cyber-cyan); padding: 15px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-family: 'Orbitron', sans-serif; transition: all 0.3s; text-transform: uppercase; }
        .cut-btn:hover { background: var(--cyber-cyan); color: #000; }

        .download-btn { background: transparent; color: #cc66ff; border: 1px solid #cc66ff; padding: 15px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-family: 'Orbitron', sans-serif; transition: all 0.3s; text-transform: uppercase; }
        .download-btn:hover { background: #cc66ff; color: #fff; }
        
        .undo-btn-wrapper { display: flex; justify-content: center; margin-top: 15px; }
        .undo-btn { display: none; background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; align-items: center; gap: 8px; font-size: 12px; font-family: 'Orbitron', sans-serif; transition: all 0.2s; text-transform: uppercase; }
        .undo-btn:hover { background: #334155; }

        .result-box { background: #000000; border: 1px dashed #38bdf8; padding: 15px; white-space: pre-wrap; border-radius: 8px; font-size: 14px; margin-top: 15px; display: none; color: var(--text-color); line-height: 1.7; width: 100%; box-sizing: border-box; font-family: 'Fira Code', monospace; }
        
        .highlight-red { color: var(--neon-pink); font-weight: 700; }
        .highlight-hash { color: var(--cyber-cyan); font-weight: 600; }
        .highlight-meta { color: #38bdf8; font-weight: 600; display: block; border-bottom: 1px dashed var(--glass-border); padding-bottom: 8px; margin-bottom: 12px; font-family: 'Orbitron', sans-serif; font-size: 12px; }

        .counter-text { text-align: center; color: #38bdf8; font-weight: 600; margin: 15px 0 5px 0; display: none; font-size: 12px; font-family: 'Orbitron', sans-serif; }

        .file-label { cursor: pointer; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.03); color: #38bdf8; padding: 8px 14px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--glass-border); margin-bottom: 12px; font-family: 'Orbitron', sans-serif; transition: all 0.3s; }
        .file-label:hover { background: rgba(56, 189, 248, 0.08); border-color: #38bdf8; }

        #toast { position: fixed; bottom: -70px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #38bdf8; padding: 14px 28px; border-radius: 8px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2000; display: flex; align-items: center; gap: 8px; font-size: 12px; border: 1px solid var(--glass-border); font-family: 'Orbitron', sans-serif; }
        #toast.show { bottom: 40px; }
        
        footer { text-align: center; padding: 15px; font-size: 10px; background: rgba(4, 6, 10, 0.8); border-top: 1px solid var(--glass-border); margin-top: auto; color: var(--text-muted); letter-spacing: 1px; z-index: 10; font-family: 'Orbitron', sans-serif; }
        footer a { color: var(--cyber-cyan); text-decoration: none; font-weight: 600; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-box { background: #0f172a; padding: 25px; border-radius: 12px; text-align: center; max-width: 320px; border: 1px solid var(--glass-border); color: #fff; }
        .modal-btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; font-family: 'Orbitron', sans-serif; transition: all 0.2s; text-transform: uppercase; }
        .modal-btn.cancel { background: #1e293b; color: #fff; }
        .modal-btn.confirm { background: var(--neon-pink); color: white; }

        .scroll-down-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #000000;
            border: 1px solid var(--glass-border);
            color: #38bdf8;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: none; 
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
        }
        .scroll-down-btn:hover { background: #38bdf8; color: #000; }
    </style>
</head>
<body>

<button id="scrollBtn" class="scroll-down-btn" onclick="scrollToBottom()">
    <i class="fas fa-angle-double-down"></i>
</button>

<div class="container" id="mainContainer">
    <header>
        <div class="brand-section">
            <i class="fas fa-file-code brand-logo"></i>
            <h1 class="brand-title">SCRIPTIFY PRO</h1>
            <span class="brand-subtitle">SCRIPT SPLITTER</span>
        </div>
    </header>
    
    <div id="cut" class="content glass-panel">
        <label class="file-label" for="fileInputCut">
            <i class="fas fa-file-import"></i> UPLOAD TXT FILE
        </label>
        <input type="file" id="fileInputCut" accept=".txt" style="display:none;" onchange="handleFileUpload(this, 'cutInput')">
        
        <div class="input-wrapper">
            <textarea id="cutInput" placeholder="Write or paste your full story here..."></textarea>
            <div class="action-tray">
                <button id="btnDelCut" class="icon-btn delete" onclick="showPopup('cut')">
                    <i class="fas fa-trash-arrow-up"></i>
                </button>
            </div>
        </div>
        <div id="cutWords" class="word-count">Word Count: 0</div>
    </div>

    <div class="glass-panel">
        <div class="search-row">
            <div class="search-input-wrapper">
                <input type="text" id="charName" placeholder="Character name (Abir)" oninput="saveData('charName');">
            </div>
            <button class="extract-btn" onclick="extractDialogs()">
                <i class="fas fa-bolt"></i> Extract
            </button>
        </div>
    </div>
    
    <div id="cutCounter" class="counter-text"></div>
    <div id="cutResult" class="result-box glass-panel"></div>
    
    <div id="cutActions" class="btn-group">
        <button class="cut-btn" onclick="cutContent('cutResult')">
            <i class="fas fa-scissors"></i> Cut Dialogs
        </button>
        <button class="download-btn" onclick="downloadTxt('cutResult', 'dialogs.txt')">
            <i class="fas fa-file-arrow-down"></i> Download
        </button>
    </div>

    <div class="undo-btn-wrapper">
        <button id="undoBtn" class="undo-btn" onclick="handleUndo()">
            <i class="fas fa-rotate-left"></i> Rollback Cut 
        </button>
    </div>
</div>

<div id="deleteModal" class="modal-overlay">
    <div class="modal-box">
        <i class="fas fa-triangle-exclamation" style="font-size:35px; color:var(--neon-pink);"></i>
        <p style="font-family:'Orbitron', sans-serif; font-weight:600; font-size:13px; margin:15px 0;">WIPE ALL TERMINAL DATA?</p>
        <div class="modal-btn-group">
            <button class="modal-btn cancel" onclick="closePopup()">CANCEL</button>
            <button id="confirmDelBtn" class="modal-btn confirm">WIPE</button>
        </div>
    </div>
</div>
<div id="toast"></div>

<footer>
    SYSTEM DEV : <a href="https://www.facebook.com/share/1D2uhwVQDq/" target="_blank">ABIR AHMED JIHAD</a>
</footer>

<script>
    let currentDeleteType = '';
    let historyState = null; 
    let currentExtractedBlocksIndices = []; 
    let pureExtractedText = ""; 
    let extractedDialogIndicesOnly = []; 

    window.onload = function() {
        ['cutInput', 'charName'].forEach(id => {
            const saved = localStorage.getItem(id);
            if(saved) {
                document.getElementById(id).value = saved;
                if(id.includes('Input')) {
                    updateWordCount(id, 'cutWords');
                    toggleClearBtn(id, 'btnDelCut');
                }
            }
        });
        document.getElementById('cutInput').addEventListener('input', function() {
            onInputUpdate('cutInput', 'cutWords', 'btnDelCut');
        });
        if(document.getElementById('cutInput').value && document.getElementById('charName').value) extractDialogs(true);
    }

    function scrollToBottom() {
        const container = document.getElementById('mainContainer');
        container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }

    function toggleScrollBtn() {
        const resBox = document.getElementById('cutResult');
        const scrollBtn = document.getElementById('scrollBtn');
        scrollBtn.style.display = (resBox && resBox.style.display === 'block') ? 'flex' : 'none';
    }

    // ইউনিকোড এবং ও-কার (ো / ে+া) এর জটিলতা দূর করার জন্য হেল্পার ফাংশন
    function cleanBengaliText(str) {
        if (!str) return "";
        return str.trim();
    }

    // ও-কার (ো) এবং ভাঙা ও-কার (ে + া) কে রেগুলার এক্সপ্রেশনের মাধ্যমে সাধারণ প্যাটার্নে রূপান্তর করার লজিক
    function buildBengaliFlexibleRegex(name) {
        let escaped = name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        
        // বাংলায় ও-কার (ো) ৩ টি উপায়ে টাইপ হতে পারে:
        // ১. সরাসরি ও-কার (U+09CB) 
        // ২. এ-কার (U+09C7) + আ-কার (U+09BE)
        // ৩. এ-কার (U+09C7) + কোনোভাবে অন্য ক্যারেক্টার + আ-কার
        // এটি হ্যান্ডেল করার জন্য প্রতিস্থাপক তৈরি করি
        let flexible = escaped
            .replace(/ো/g, "(ো|ে\u200B*া)")
            .replace(/ে\u200B*া/g, "(ো|ে\u200B*া)")
            // একই নিয়ম কো-কার (ো) এর মতই যো, লো, তো ইত্যাদির সকল ও-কার কাভার করবে
            .replace(/\u09CB/g, "(\u09CB|\u09C7\u200B*\u09BE)")
            .replace(/\u09C7\u200B*\u09BE/g, "(\u09CB|\u09C7\u200B*\u09BE)");
            
        return flexible;
    }

    function onInputUpdate(inputId, wordId, btnId) { 
        saveData(inputId); 
        updateWordCount(inputId, wordId); 
        toggleClearBtn(inputId, btnId);
    }

    function toggleClearBtn(inputId, btnId) {
        const val = document.getElementById(inputId).value.trim();
        document.getElementById(btnId).style.display = val.length > 0 ? "flex" : "none";
    }

    function updateWordCount(inputId, wordId) {
        const text = document.getElementById(inputId).value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        document.getElementById(wordId).innerText = "Word Count: " + words;
    }

    function saveData(id) { localStorage.setItem(id, document.getElementById(id).value); }

    function showPopup(type) { 
        currentDeleteType = type; 
        document.getElementById('deleteModal').style.display = 'flex';
        document.getElementById('confirmDelBtn').onclick = function() { fullClear(currentDeleteType); closePopup(); }; 
    }
    function closePopup() { document.getElementById('deleteModal').style.display = 'none'; }

    function fullClear(type) {
        ['cutInput', 'charName'].forEach(id => { document.getElementById(id).value = ""; localStorage.removeItem(id); });
        document.getElementById('cutResult').style.display = 'none';
        document.getElementById('cutCounter').style.display = 'none';
        document.getElementById('cutActions').style.display = 'none';
        document.getElementById('undoBtn').style.display = 'none';
        historyState = null;
        currentExtractedBlocksIndices = [];
        extractedDialogIndicesOnly = [];
        pureExtractedText = "";
        updateWordCount('cutInput', 'cutWords');
        toggleClearBtn('cutInput', 'btnDelCut');
        toggleScrollBtn();
        showToast("System cleaned!");
    }

    function handleFileUpload(input, targetId) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById(targetId).value = e.target.result; 
                onInputUpdate(targetId, 'cutWords', 'btnDelCut');
                extractDialogs(true);
                showToast("File injected successfully!");
            };
            reader.readAsText(file);
        }
    }

    function extractDialogs(isInitialLoad = false) {
        if (document.getElementById('undoBtn').style.display === 'inline-flex' && isInitialLoad) return;

        const text = document.getElementById('cutInput').value;
        const name = document.getElementById('charName').value.trim();
        const res = document.getElementById('cutResult');
        const ctr = document.getElementById('cutCounter');
        const acts = document.getElementById('cutActions');

        if(!name || !text.trim()) {
            res.style.display = 'none'; ctr.style.display = 'none'; acts.style.display = 'none';
            toggleScrollBtn();
            return;
        }

        const cleanedTargetName = cleanBengaliText(name);
        const flexiblePattern = buildBengaliFlexibleRegex(cleanedTargetName);
        const blocks = text.split(/\n\s*\n/);
        
        let tempOutput = [];
        let totalDialogsCount = 0;
        currentExtractedBlocksIndices = []; 
        extractedDialogIndicesOnly = []; 

        // ডায়নামিক রিজেক্স যা 'আলো' এবং 'আলো' উভয়কেই একসাথে ম্যাচ করতে পারে
        const dynamicRegex = new RegExp('^([^\\p{L}\\p{N}]*)(' + flexiblePattern + ')', 'iu');

        for (let i = 0; i < blocks.length; i++) {
            const rawBlock = blocks[i];
            const trimmedBlock = rawBlock.trim();
            
            if (trimmedBlock.startsWith('#')) {
                tempOutput.push({ type: 'hash', index: i, text: trimmedBlock });
                continue;
            }

            const match = trimmedBlock.match(dynamicRegex);
            
            if (match) {
                totalDialogsCount++;
                
                const prefixSymbols = match[1]; 
                const matchedName = match[2];     
                
                const matchedLength = prefixSymbols.length + matchedName.length;
                const restOfBlock = trimmedBlock.substring(matchedLength);
                
                const formattedText = prefixSymbols + '<span class="highlight-red">' + matchedName + '</span>' + restOfBlock;
                
                tempOutput.push({ type: 'dialog', index: i, text: formattedText, rawText: trimmedBlock });
                continue;
            }
            tempOutput.push({ type: 'other', index: i });
        }

        let html = "";
        let rawTextForCounting = "";
        let textForCopyAndDownload = ""; 

        for (let i = 0; i < tempOutput.length; i++) {
            if (tempOutput[i].type === 'hash') {
                let hasDialog = false;
                for (let j = i + 1; j < tempOutput.length; j++) {
                    if (tempOutput[j].type === 'hash') break; 
                    if (tempOutput[j].type === 'dialog') { hasDialog = true; break; }
                }
                if (hasDialog) {
                    html += '<span class="highlight-hash">' + tempOutput[i].text + '</span>' + "\n\n";
                    rawTextForCounting += tempOutput[i].text + " ";
                    textForCopyAndDownload += tempOutput[i].text + "\n\n";
                    currentExtractedBlocksIndices.push(tempOutput[i].index);
                }
            } else if (tempOutput[i].type === 'dialog') {
                html += tempOutput[i].text + "\n\n";
                rawTextForCounting += tempOutput[i].rawText + " ";
                
                let plainDialog = tempOutput[i].text.replace(/<\/?[^>]+(>|$)/g, "");
                textForCopyAndDownload += plainDialog + "\n\n";
                currentExtractedBlocksIndices.push(tempOutput[i].index);
                extractedDialogIndicesOnly.push(tempOutput[i].index); 
            }
        }

        pureExtractedText = textForCopyAndDownload.trim();
        const totalOutputWords = rawTextForCounting.trim() ? rawTextForCounting.trim().split(/\s+/).length : 0;

        if(totalDialogsCount > 0 || html.length > 0) {
            ctr.innerText = "TOTAL DIALOGUES MATCHED: " + totalDialogsCount; ctr.style.display = "block";
            res.innerHTML = '<span class="highlight-meta">TOTAL EXTRACTED WORDS: ' + totalOutputWords + '</span>' + html; 
            res.style.display = "block";
            acts.style.display = "grid";
        } else {
            if(!isInitialLoad) showToast("No dialogue matched!", "error");
            res.style.display = 'none'; ctr.style.display = 'none'; acts.style.display = 'none';
        }
        toggleScrollBtn();
    }

    function fallbackCopyText(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";  
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            document.body.removeChild(textArea);
            return true;
        } catch (err) {
            document.body.removeChild(textArea);
            return false;
        }
    }

    function cutContent(id) { 
        const textInput = document.getElementById('cutInput');
        const resBox = document.getElementById(id);
        if(!pureExtractedText || !textInput.value.trim()) return;

        historyState = {
            mainText: textInput.value,
            resultHtml: resBox.innerHTML,
            counterText: document.getElementById('cutCounter').innerText
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pureExtractedText)
                .then(() => executeCutLogic())
                .catch(() => {
                    if(fallbackCopyText(pureExtractedText)) executeCutLogic();
                    else showToast("Failed to copy/cut", "error");
                });
        } else {
            if(fallbackCopyText(pureExtractedText)) executeCutLogic();
            else showToast("Failed to copy/cut", "error");
        }
    }

    function executeCutLogic() {
        const textInput = document.getElementById('cutInput');
        const originalBlocks = textInput.value.split(/\n\s*\n/);
        const remainingBlocks = originalBlocks.filter((block, idx) => !extractedDialogIndicesOnly.includes(idx));

        textInput.value = remainingBlocks.join("\n\n");
        saveData('cutInput');
        updateWordCount('cutInput', 'cutWords');
        toggleClearBtn('cutInput', 'btnDelCut');
        
        document.getElementById('cutResult').style.display = 'none';
        document.getElementById('cutCounter').style.display = 'none';
        document.getElementById('cutActions').style.display = 'none';
        document.getElementById('undoBtn').style.display = 'inline-flex';
        toggleScrollBtn();
        showToast("Cut & Copy success!");
    }

    function handleUndo() {
        if (historyState) {
            document.getElementById('cutInput').value = historyState.mainText;
            saveData('cutInput');
            updateWordCount('cutInput', 'cutWords');
            toggleClearBtn('cutInput', 'btnDelCut');

            document.getElementById('cutResult').innerHTML = historyState.resultHtml;
            document.getElementById('cutResult').style.display = 'block';
            document.getElementById('cutCounter').innerText = historyState.counterText;
            document.getElementById('cutCounter').style.display = 'block';
            document.getElementById('cutActions').style.display = 'grid';
            document.getElementById('undoBtn').style.display = 'none';
            historyState = null;
            toggleScrollBtn();
            showToast("Rollback success!");
        }
    }

    function downloadTxt(id, filename) {
        if(!pureExtractedText) return;
        const blob = new Blob([pureExtractedText], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        showToast("Download started...");
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        toast.style.color = type === 'error' ? 'var(--neon-pink)' : '#38bdf8';
        toast.innerHTML = (type === 'error' ? '<i class="fas fa-times-circle"></i> ' : '<i class="fas fa-check-circle"></i> ') + msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
